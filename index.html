<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Külastusgraafik — Poodide külastustarkvara</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
</head>
<body>

<div class="offline-bar" id="offlineBar">⚡ Internetiühendus puudub — andmed salvestatakse kohalikult</div>
<div id="app"></div>

<nav class="nav">
  <button class="nav-btn active" id="nav-home" onclick="go('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Kodu
  </button>
  <button class="nav-btn" id="nav-visit" onclick="go('visit')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
    <div class="nav-dot" id="vDot" style="display:none"></div>
    Külastus
  </button>
  <button class="nav-btn" id="nav-orders" onclick="go('orders')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    Tellimused
  </button>
  <button class="nav-btn" id="nav-delivery" onclick="go('delivery')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
    Tarne
  </button>
  <button class="nav-btn" id="nav-history" onclick="go('history')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    Ajalugu
  </button>
</nav>

<!-- MODALS -->
<div class="overlay" id="mAddStore" onclick="if(event.target===this)cm('mAddStore')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Lisa uus pood</div>
    <input class="inp" id="newStoreName" placeholder="nt Rimi Sõle" style="margin-bottom:12px" onkeydown="if(event.key==='Enter')addStore()">
    <button class="btn btn-primary btn-block" onclick="addStore()">Lisa pood</button>
  </div>
</div>

<div class="overlay" id="mAddTask" onclick="if(event.target===this)cm('mAddTask')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Lisa ülesanne</div>
    <input class="inp" id="newTask" placeholder="Ülesande kirjeldus..." style="margin-bottom:12px" onkeydown="if(event.key==='Enter')addTask()">
    <button class="btn btn-primary btn-block" onclick="addTask()">Lisa ülesanne</button>
  </div>
</div>

<div class="overlay" id="mAddOrder" onclick="if(event.target===this)cm('mAddOrder')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Lisa tellimus</div>
    <input class="inp" id="oProd" placeholder="Toote nimi" style="margin-bottom:8px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
      <input class="inp" id="oQty" type="number" placeholder="Kogus" min="0" step="0.1">
      <input class="inp" id="oUnit" placeholder="Ühik (tk, kg...)">
    </div>
    <input class="inp" id="oPrice" type="number" placeholder="Ühiku hind (€)" style="margin-bottom:8px">
    <input class="inp" id="oNotes" placeholder="Märkused (valikuline)" style="margin-bottom:14px">
    <button class="btn btn-primary btn-block" onclick="addOrder()">Lisa tellimus</button>
  </div>
</div>

<div class="overlay" id="mAddDel" onclick="if(event.target===this)cm('mAddDel')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Lisa tarne kirje</div>
    <input class="inp" id="dProd" placeholder="Toote nimi" style="margin-bottom:8px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
      <input class="inp" id="dQty" type="number" placeholder="Kogus">
      <input class="inp" id="dUnit" placeholder="Ühik">
    </div>
    <div style="margin-bottom:12px">
      <div style="font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px">Tarnestaatus</div>
      <div class="del-btns" id="delBtns">
        <div class="del-btn s-ok" data-s="delivered" onclick="selDel('delivered',this)">✓ Tarnitud</div>
        <div class="del-btn" data-s="partial" onclick="selDel('partial',this)">~ Osaline</div>
        <div class="del-btn" data-s="rejected" onclick="selDel('rejected',this)">✕ Keeldutud</div>
      </div>
    </div>
    <input class="inp" id="dNotes" placeholder="Märkused" style="margin-bottom:14px">
    <button class="btn btn-primary btn-block" onclick="addDelivery()">Lisa kirje</button>
  </div>
</div>

<div class="overlay" id="mReport" onclick="if(event.target===this)cm('mReport')">
  <div class="sheet" id="reportSheet">
    <div class="sheet-handle"></div>
    <div id="reportBody"></div>
    <button class="btn btn-outline btn-block" style="margin-top:14px" onclick="cm('mReport')">Sulge</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
