<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Külastusgraafik — Haldus</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F59E0B'/%3E%3Cpath d='M16 7a6 6 0 016 6c0 4.5-6 12-6 12S10 17.5 10 13a6 6 0 016-6z' fill='%230B0D13'/%3E%3Ccircle cx='16' cy='13' r='2.2' fill='%23F59E0B'/%3E%3C/svg%3E">
</head>
<body>

<!-- ── LOGIN ────────────────────────────────────────────────────────── -->
<div id="login" class="login-wrap">
  <form class="login-card" id="loginForm">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
    </div>
    <h1>Külastusgraafik</h1>
    <p class="login-sub">Poodide külastustarkvara — haldusliides</p>
    <label class="lbl" for="lgUser">Kasutajanimi</label>
    <input class="inp" id="lgUser" autocomplete="username" autofocus>
    <label class="lbl" for="lgPass">Parool</label>
    <input class="inp" id="lgPass" type="password" autocomplete="current-password">
    <div class="login-err" id="lgErr"></div>
    <button class="btn btn-primary btn-block" type="submit" id="lgBtn">Logi sisse</button>
  </form>
</div>

<!-- ── APP SHELL ────────────────────────────────────────────────────── -->
<div id="shell" class="shell" hidden>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </div>
      <div>
        <div class="brand-name">Külastusgraafik</div>
        <div class="brand-sub">Haldus</div>
      </div>
    </div>

    <nav class="side-nav" id="sideNav">
      <button data-route="dashboard" class="side-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        Ülevaade
      </button>
      <button data-route="photos" class="side-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Failid ja pildid
      </button>
      <button data-route="visits" class="side-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Külastused
      </button>
      <button data-route="stores" class="side-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v11a1 1 0 001 1h14a1 1 0 001-1V9"/><path d="M3 9a3 3 0 006 0 3 3 0 006 0 3 3 0 006 0"/></svg>
        Poed
      </button>
      <button data-route="users" class="side-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/></svg>
        Kasutajad
      </button>
    </nav>

    <div class="side-foot">
      <div class="who">
        <div class="who-avatar" id="whoAvatar">A</div>
        <div class="who-text">
          <div class="who-name" id="whoName">—</div>
          <div class="who-role" id="whoRole">—</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-block btn-sm" id="logoutBtn">Logi välja</button>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<!-- ── LIGHTBOX ─────────────────────────────────────────────────────── -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lbClose" aria-label="Sulge">&times;</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Eelmine">&#8249;</button>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Järgmine">&#8250;</button>
  <figure class="lb-figure">
    <img id="lbImg" alt="">
    <figcaption id="lbCap"></figcaption>
  </figure>
</div>

<!-- ── MODAL ────────────────────────────────────────────────────────── -->
<div class="modal-wrap" id="modalWrap" hidden>
  <div class="modal" id="modal"></div>
</div>

<div class="toast-stack" id="toasts"></div>

<script src="admin.js"></script>
</body>
</html>
